name: Runnable Campaign Capability Fix

on:
  push:
    branches: [gate1/runnable-campaign-integration]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gate1/runnable-campaign-integration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Seal runnable campaign capability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib_path = Path('crates/dmd-app/src/lib.rs')
          lib = lib_path.read_text()
          old = '''#[derive(Debug, Clone, PartialEq, Eq)]
          pub struct RunnableCampaign {
              pub lifecycle: CampaignLifecycleSummary,
              pub state: CampaignState,
              pub content: ResolvedCampaignContent,
          }
          '''
          new = '''#[derive(Debug, Clone, PartialEq, Eq)]
          pub struct RunnableCampaign {
              lifecycle: CampaignLifecycleSummary,
              state: CampaignState,
              content: ResolvedCampaignContent,
          }

          impl RunnableCampaign {
              #[must_use]
              pub fn lifecycle(&self) -> &CampaignLifecycleSummary {
                  &self.lifecycle
              }

              #[must_use]
              pub fn state(&self) -> &CampaignState {
                  &self.state
              }

              #[must_use]
              pub fn content(&self) -> &ResolvedCampaignContent {
                  &self.content
              }
          }
          '''
          if old not in lib:
              raise SystemExit('expected RunnableCampaign public-field block not found')
          lib_path.write_text(lib.replace(old, new, 1))

          test_path = Path('crates/dmd-app/tests/runnable_campaign.rs')
          test = test_path.read_text()
          replacements = {
              'assert_eq!(created.state, expected);': 'assert_eq!(created.state(), &expected);',
              'created.content.ruleset.manifest.id': 'created.content().ruleset.manifest.id',
              'created.content.content_packs.len()': 'created.content().content_packs.len()',
              'assert_eq!(opened.state, expected);': 'assert_eq!(opened.state(), &expected);',
              'assert_eq!(resumed.state, expected);': 'assert_eq!(resumed.state(), &expected);',
              '''            .expect("restart should reopen through content resolution")
                      .state,
                  expected
          ''': '''            .expect("restart should reopen through content resolution")
                      .state(),
                  &expected
          ''',
              'assert_eq!(restored.state, expected);': 'assert_eq!(restored.state(), &expected);',
              '''            .expect("beta should remain runnable")
                      .state,
                  beta
          ''': '''            .expect("beta should remain runnable")
                      .state(),
                  &beta
          ''',
          }
          for before, after in replacements.items():
              if before not in test:
                  raise SystemExit(f'expected test pattern not found: {before!r}')
              test = test.replace(before, after, 1)
          test_path.write_text(test)
          PY
          cargo fmt --all
          cargo test --locked -p dmd-app --test runnable_campaign
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/dmd-app/src/lib.rs crates/dmd-app/tests/runnable_campaign.rs
          git commit -m 'fix: seal runnable campaign capability'
          git push origin HEAD:gate1/runnable-campaign-integration
