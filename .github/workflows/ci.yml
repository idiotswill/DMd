name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  genericity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prevent campaign-specific production assumptions
        shell: bash
        run: |
          if grep -RniE 'Sylvara|Torrek|Milo|Cassian|Eirenhold|Veyrath|Asterra' crates/; then
            echo 'Campaign-specific Asterra terms are forbidden in production Rust crates.'
            exit 1
          fi
