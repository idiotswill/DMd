name: Lifecycle integrated tightening

on:
  push:
    branches: [gate1/campaign-lifecycle]

permissions:
  contents: write

jobs:
  tighten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Tighten audit and projection integration invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lifecycle = Path('crates/dmd-persistence/src/lifecycle.rs')
          text = lifecycle.read_text()
          old = '''        if accepted {
              if row.resolution_explanation.trim().is_empty() {
                  return Err(LifecycleError::CorruptExport(
                      "accepted command resolution explanation must not be empty".into(),
                  ));
              }
              if row.resulting_event_sequence <= row.expected_event_sequence {
                  return Err(LifecycleError::CorruptExport(
                      "accepted command must advance the event sequence".into(),
                  ));
              }
          }
          commands.insert(
          '''
          new = '''        if row.resolution_explanation.trim().is_empty() {
              return Err(LifecycleError::CorruptExport(
                  "command resolution explanation must not be empty".into(),
              ));
          }
          if accepted {
              if row.resulting_event_sequence <= row.expected_event_sequence {
                  return Err(LifecycleError::CorruptExport(
                      "accepted command must advance the event sequence".into(),
                  ));
              }
          } else if row.resulting_event_sequence != row.expected_event_sequence {
              return Err(LifecycleError::CorruptExport(
                  "rejected command must not advance the event sequence".into(),
              ));
          }
          commands.insert(
          '''
          if old not in text:
              raise SystemExit('accepted command validation marker not found')
          lifecycle.write_text(text.replace(old, new, 1))

          tests = Path('crates/dmd-persistence/tests/campaign_lifecycle_integrity.rs')
          text = tests.read_text()
          text = text.replace(
              '''    create_campaign, export_campaign, migrate_sqlite, open_campaign, purge_campaign,\n    restore_campaign, save_play_session,\n''',
              '''    create_campaign, export_campaign, load_campaign_projection_summary, migrate_sqlite,\n    open_campaign, purge_campaign, restore_campaign, save_play_session,\n''',
              1,
          )
          old_projection = '''    let has_projection_table: i64 = sqlx::query_scalar(
              "SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'projection_heads'",
          )
          .fetch_one(&pool)
          .await
          .expect("schema introspection should work");
          if has_projection_table == 1 {
              let projections: i64 =
                  sqlx::query_scalar("SELECT COUNT(*) FROM projection_heads WHERE campaign_id = ?")
                      .bind(&export.campaign_id)
                      .fetch_one(&pool)
                      .await
                      .expect("projection head count should query");
              assert_eq!(projections, 0, "derivative projections must cascade away");
          }
          '''
          new_projection = '''    let projections: i64 =
              sqlx::query_scalar("SELECT COUNT(*) FROM projection_heads WHERE campaign_id = ?")
                  .bind(&export.campaign_id)
                  .fetch_one(&pool)
                  .await
                  .expect("projection head count should query");
          assert_eq!(projections, 0, "derivative projections must cascade away");
          '''
          if old_projection not in text:
              raise SystemExit('projection purge assertion marker not found')
          text = text.replace(old_projection, new_projection, 1)

          old_final = '''    restore_campaign(&pool, &export)
              .await
              .expect("original replay-safe export should still restore");
          }
          '''
          new_final = '''    let mut with_rejected_audit = export.clone();
          let mut rejected = with_rejected_audit.command_audit[0].clone();
          rejected.id = uuid::Uuid::new_v4().to_string();
          rejected.accepted = 0;
          rejected.expected_event_sequence = export.current_state.applied_event_sequence;
          rejected.resulting_event_sequence = export.current_state.applied_event_sequence;
          rejected.resolution_explanation = "rejected command remains eventless".into();
          with_rejected_audit.command_audit.push(rejected);
          restore_campaign(&pool, &with_rejected_audit)
              .await
              .expect("replay-safe export with an eventless rejected audit should restore");

          let projection = load_campaign_projection_summary(&pool, campaign_id)
              .await
              .expect("restore must rebuild derivative projections from current state");
          assert_eq!(
              projection.applied_event_sequence,
              u64::try_from(export.current_state.applied_event_sequence).unwrap()
          );
          }
          '''
          if old_final not in text:
              raise SystemExit('final valid restore marker not found')
          text = text.replace(old_final, new_final, 1)
          tests.write_text(text)
          PY
          cargo fmt --all
          cargo test --locked -p dmd-persistence --test campaign_lifecycle_integrity
          cargo test --locked -p dmd-persistence
      - name: Commit integrated tightening and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lifecycle-integrated-tightening.yml
          git add crates/dmd-persistence/src/lifecycle.rs crates/dmd-persistence/tests/campaign_lifecycle_integrity.rs
          git commit -m "Tighten lifecycle audit and projection invariants"
          git push origin HEAD:gate1/campaign-lifecycle
