name: Runnable Campaign Branch Autofix

on:
  push:
    branches: [gate1/runnable-campaign-integration]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gate1/runnable-campaign-integration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply generated repository changes
        run: |
          cargo fmt --all
          cargo generate-lockfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/dmd-app
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: format runnable integration and refresh lockfile'
          git push origin HEAD:gate1/runnable-campaign-integration
