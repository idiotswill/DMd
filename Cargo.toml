[workspace]
resolver = "2"
members = [
  "crates/dmd-domain",
  "crates/dmd-core",
  "crates/dmd-rules",
  "crates/dmd-persistence",
  "crates/dmd-conversation",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "uuid", "migrate"] }
